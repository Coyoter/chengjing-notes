name: Fragment card integration validation
on:
  push:
    branches: [work/fragment-cards-v0.10.9]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source for review
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-card-source
          path: source.tar
          retention-days: 1
