name: Fleeting cards validation
on:
  push:
    branches: [fix/fleeting-cards-v0.10.9]
    paths:
      - scripts/fleeting-update.b64
permissions:
  contents: write
concurrency:
  group: fleeting-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source update
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          parts = sorted(Path('scripts').glob('fleeting-update.part*')) + [Path('scripts/fleeting-update.b64')]
          encoded = ''.join(p.read_text().strip() for p in parts if p.exists())
          changes = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          pending = []
          for item in changes:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if path.as_posix().startswith('.github/workflows/'):
                  continue
              old = path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == item['before'], f'Changed base: {path}'
              new = old
              for start, end, text in reversed(item['edits']):
                  new = new[:start] + text + new[end:]
              assert hashlib.sha256(new.encode()).hexdigest() == item['after'], f'Invalid output: {path}'
              pending.append((path, new))
          for path, new in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(new)
              print('UPDATED', path)
          for p in parts:
              if p.exists(): p.unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make quick captures canonical inbox cards with safe legacy migration'
          git push origin HEAD:fix/fleeting-cards-v0.10.9
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Desktop and mobile regression tests
        run: |
          node scripts/qa-preview-overflow.mjs
          npm run qa:archive-library
          npm run qa:fleeting-cards
      - name: Source and regression evidence
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          git archive HEAD -o qa-artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleeting-validation-${{ github.run_number }}
          path: qa-artifacts/
          retention-days: 7
