name: Archive and library validation
on:
  push:
    branches: [codex/archive-library-v0.10.8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated test dependencies
        run: |
          tar --exclude='node_modules/electron/dist' --exclude='node_modules/onnxruntime-node/bin' --exclude='node_modules/onnxruntime-web/dist/*.wasm' --exclude='node_modules/@huggingface/transformers/.cache' -czf /tmp/chengjing-dependencies.tar.gz node_modules
          du -h /tmp/chengjing-dependencies.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: chengjing-test-dependencies
          path: /tmp/chengjing-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
