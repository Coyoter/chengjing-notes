name: Archive and library validation
on:
  push:
    branches: [fix/archive-library-v0.10.8]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/chengjing-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: chengjing-source
          path: /tmp/chengjing-source.tar
          retention-days: 1
