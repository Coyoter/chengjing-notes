name: Archive and library validation
on:
  push:
    branches: [codex/archive-library-v0.10.8]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: archive-library-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source changes
        run: python3 .github/apply-archive-library.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck and full unit suite
        run: |
          mkdir -p qa-artifacts
          npm run typecheck 2>&1 | tee qa-artifacts/typecheck.log
          npm test 2>&1 | tee qa-artifacts/unit-tests.log
      - name: Existing layout and new interaction regressions
        run: |
          node scripts/qa-preview-overflow.mjs 2>&1 | tee qa-artifacts/preview-overflow.log
          npm run qa:archive-library 2>&1 | tee qa-artifacts/archive-library.log
      - name: Production web build
        run: npm run build 2>&1 | tee qa-artifacts/build.log
      - name: Commit validated source to candidate branch
        run: |
          rm .github/archive-library.part{0,1,2,3} .github/apply-archive-library.py .github/workflows/archive-library-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify archived content visibility and consolidate card library (v0.10.8)'
          git push origin HEAD:codex/archive-library-v0.10.8
          git rev-parse HEAD > qa-artifacts/validated-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-library-validation-${{ github.run_number }}
          path: qa-artifacts/
          retention-days: 7
