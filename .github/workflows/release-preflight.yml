name: Cross-platform release preflight
on:
  push:
    branches: [release/all-platforms-v0.10.11]
    paths: [.github/workflows/release-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect only the required release inputs without exposing values
        env:
          ANDROID_KEYSTORE: ${{ secrets.CHENGJING_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_CREDENTIALS: ${{ secrets.CHENGJING_ANDROID_SIGNING_CREDENTIALS_JSON }}
          ANDROID_PASSWORD: ${{ secrets.CHENGJING_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.CHENGJING_ANDROID_KEY_ALIAS }}
          DESKTOP_OAUTH: ${{ secrets.CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          mkdir -p preflight
          python3 - <<'PY'
          import os,json
          report={name:bool(os.environ.get(name)) for name in ('ANDROID_KEYSTORE','ANDROID_CREDENTIALS','ANDROID_PASSWORD','ANDROID_ALIAS','DESKTOP_OAUTH')}
          with open('preflight/signing-readiness.json','w') as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve current and last Android source for release review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip 9fa643f9d976222d751cf811287eeecdcb5f11fb > preflight/current-source.zip
          git archive --format=zip v0.10.6 > preflight/android-v0.10.6-source.zip
          git diff --stat v0.10.6 9fa643f9d976222d751cf811287eeecdcb5f11fb > preflight/source-diff-stat.txt
          git diff v0.10.6 9fa643f9d976222d751cf811287eeecdcb5f11fb -- android > preflight/android-baseline.diff
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag: .tag_name, draft, prerelease, target: .target_commitish, assets: [.assets[] | {name, size, digest, url: .browser_download_url}]}' > preflight/releases.jsonl
          cat preflight/source-diff-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cross-platform-release-preflight
          path: preflight/
          retention-days: 7
