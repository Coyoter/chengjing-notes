name: macOS 澄境建置與測試版 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 執行型別檢查與必要測試
        env:
          CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          npm run typecheck
          npm test
          node scripts/qa-preview-overflow.mjs

      - name: 建置 macOS DMG
        env:
          CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.CHENGJING_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run dist:mac

      - name: 檢查並計算安裝檔雜湊
        run: |
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          shasum -a 256 release/*.dmg > release/ChengJing-macOS.sha256
          cat release/ChengJing-macOS.sha256

      - name: 上傳 Actions 建置產物
        uses: actions/upload-artifact@v4
        with:
          name: chengjing-macos-${{ github.run_number }}
          path: |
            release/*.dmg
            release/ChengJing-macOS.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 建立 GitHub 測試版 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-macos.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/*.dmg release/ChengJing-macOS.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "澄境 macOS 測試版 ${TAG}" \
            --prerelease \
            --generate-notes
